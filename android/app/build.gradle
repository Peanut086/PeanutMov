apply plugin: 'com.android.application'

// OPT-06 / REF-05：App 版本号单一来源 = 仓库根 package.json 的 `version`。
// 与 Vite define 的 __APP_VERSION__（设置页/关于页展示）同源，避免 Gradle 与前端漂移。
//
// 派生规则（唯一权威说明；SRS §6.2「版本号口径」与之同步，改规则须同时改两处）：
//   versionName = semver 核心 x.y.z（去掉 v 前缀、-prerelease、+build 元数据）
//   versionCode = x * 10000 + y * 100 + z        // 0.1.0 → 100
//   ⇒ 约束：y、z ≤ 99（每满 100 必须进位到高位），x ≤ 199（Android 上限 2100000000）
//
// REV-33：package.json 不可读（文件缺失、JSON 损坏、构建环境缺少 Groovy JSON
// 支持等）时回退到下面的字面版本，保证离线/裁剪环境仍可构建。Gradle 解析
// package.json 使用的是内置 groovy.json.JsonSlurper，不依赖 node；回退分支
// 通过临时移走 package.json 验证（见 docs/09-后端自测/DEV-05 文档）。
//
// OPT-06：回退值必须与 package.json 当前版本保持一致（现为 0.1.0），
// 否则"可读/不可读"两条构建路径会产出不同 versionCode，覆盖安装会被拒。
def FALLBACK_VERSION_NAME = '0.1.0'
def FALLBACK_VERSION_CODE = 100 // 0.1.0 → 100，与 semver 编码规则一致

// versionCode 编码上限（超出即发生版本号碰撞，见上方派生规则）
def VERSION_CODE_MAJOR_MAX = 199
def VERSION_CODE_SEGMENT_MAX = 99

def resolveVersion = {
    def pkgFile = rootProject.file('../package.json')
    if (!pkgFile.exists()) {
        logger.lifecycle("WARN: package.json not found, fallback to "
                + "${FALLBACK_VERSION_NAME} (${FALLBACK_VERSION_CODE})")
        return [FALLBACK_VERSION_NAME, FALLBACK_VERSION_CODE]
    }

    def rawVersion = ''
    def parts = null
    try {
        def pkgJson = new groovy.json.JsonSlurper().parseText(pkgFile.text)
        // 兼容 "v1.2.3" 写法；先切预发布（-beta.1）再切构建元数据（+5），
        // 避免 "0.1.0+5" 被当成第三段 "0+5" 而静默降级成 0.1.0。
        rawVersion = (pkgJson.version ?: '').toString().trim()
        def semverCore = rawVersion.tokenize('-')[0].tokenize('+')[0]
        if (semverCore.startsWith('v') || semverCore.startsWith('V')) {
            semverCore = semverCore.substring(1)
        }
        parts = semverCore.tokenize('.').collect { part -> part.isInteger() ? part.toInteger() : -1 }
    } catch (Throwable ignored) {
        logger.lifecycle("WARN: package.json unreadable (" + ignored.getClass().getSimpleName()
                + "), fallback to ${FALLBACK_VERSION_NAME} (${FALLBACK_VERSION_CODE})")
        return [FALLBACK_VERSION_NAME, FALLBACK_VERSION_CODE]
    }

    if (parts.isEmpty() || parts.any { it < 0 }) {
        logger.lifecycle("WARN: package.json version '${rawVersion}' is not semver numeric, fallback to "
                + "${FALLBACK_VERSION_NAME} (${FALLBACK_VERSION_CODE})")
        return [FALLBACK_VERSION_NAME, FALLBACK_VERSION_CODE]
    }
    while (parts.size() < 3) { parts << 0 }
    if (parts.size() > 3) {
        logger.lifecycle("WARN: package.json version '${rawVersion}' has more than 3 segments, "
                + "only ${parts[0]}.${parts[1]}.${parts[2]} is used")
        parts = parts.take(3)
    }
    if (parts[0] == 0 && parts[1] == 0 && parts[2] == 0) {
        logger.lifecycle("WARN: package.json version is empty/zero, fallback to "
                + "${FALLBACK_VERSION_NAME} (${FALLBACK_VERSION_CODE})")
        return [FALLBACK_VERSION_NAME, FALLBACK_VERSION_CODE]
    }
    if (parts[0] > VERSION_CODE_MAJOR_MAX
            || parts[1] > VERSION_CODE_SEGMENT_MAX
            || parts[2] > VERSION_CODE_SEGMENT_MAX) {
        // 不中断构建（回退会让 versionCode 倒退），但必须显式暴露：此时 versionCode 会与
        // 相邻版本碰撞（如 0.1.100 与 0.2.0 同为 200），上架/覆盖安装会失败。
        logger.lifecycle("WARN: version '${rawVersion}' exceeds versionCode encoding bounds "
                + "(major <= ${VERSION_CODE_MAJOR_MAX}, minor/patch <= ${VERSION_CODE_SEGMENT_MAX}); "
                + "bump major/minor before releasing")
    }

    def versionName = "${parts[0]}.${parts[1]}.${parts[2]}"
    if (rawVersion != versionName) {
        logger.lifecycle("INFO: versionName uses semver core only ('${rawVersion}' -> '${versionName}'); "
                + "pre-release/build suffix is tracked by __BUILD_TIME__")
    }
    // 保证 versionCode 随 semver 单调递增（上架/覆盖安装要求）
    def versionCode = parts[0] * 10000 + parts[1] * 100 + parts[2]
    logger.lifecycle("VERSION: versionName=${versionName} versionCode=${versionCode} "
            + "(source=../package.json '${rawVersion}')")
    return [versionName, versionCode]
}

def resolvedVersion = resolveVersion()
def appVersionName = resolvedVersion[0]
def appVersionCode = resolvedVersion[1]

android {
    namespace "com.qoder.cinema"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.qoder.cinema"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // TVBox jar 爬虫运行时依赖：第三方 jar 内部直接用 okhttp/gson/slf4j
    implementation "com.squareup.okhttp3:okhttp:4.9.3"
    // gson 2.10.1：guard 系 jar（csp_*Guard）引用 ToNumberPolicy 等 2.8.9+ API，
    // 宿主旧版 2.8.6 会让 jar init 抛 NoClassDefFoundError，半初始化后再被调用
    // 会触发 jar 内 native 代码崩溃（真机 SIGSEGV，见 CrashSentinel crash_history）
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "org.slf4j:slf4j-android:1.7.36"
    // CHG-16 drpy 运行时：QuickJS 引擎（纯 Java 绑定，同步 API，支持 ES2020/async）+ jsoup（pdfh/pdfa 选择器）
    implementation "wang.harlon.quickjs:wrapper-android:3.2.3"
    implementation "org.jsoup:jsoup:1.18.3"
    // v1.7/CHG-21 ExoPlayer PoC（Spike）：Media3 原生引擎，默认不启用（experimentalNativePlayer）
    // 退出标准见 docs/02-方案/契约变更-v1.7.md §2.4；不达标可整段移除回退 WebView
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.3.1"
    implementation "androidx.media3:media3-ui:1.3.1"
    // P0-4: OkHttp 数据源（连接池、HTTP/2、gzip）
    implementation "androidx.media3:media3-datasource-okhttp:1.3.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
