apply plugin: 'com.android.application'

// OPT-06 / REF-05：版本号优先取仓库根 package.json（与 Vite define 的
// __APP_VERSION__ 同源，避免 Gradle 与前端展示漂移）。
//
// REV-33：package.json 不可读（文件缺失、JSON 损坏、构建环境缺少 Groovy JSON
// 支持等）时回退到下面的字面版本，保证离线/裁剪环境仍可构建。Gradle 解析
// package.json 使用的是内置 groovy.json.JsonSlurper，不依赖 node；回退分支
// 通过临时移走 package.json 验证（见 docs/09-后端自测/DEV-05 文档）。
def FALLBACK_VERSION_NAME = '0.1.0'
def FALLBACK_VERSION_CODE = 100 // 0.1.0 → 100，与 semver 编码规则一致

def resolveVersion = {
    def versionName = FALLBACK_VERSION_NAME
    def versionCode = FALLBACK_VERSION_CODE
    try {
        def pkgFile = rootProject.file('../package.json')
        if (pkgFile.exists()) {
            def pkgJson = new groovy.json.JsonSlurper().parseText(pkgFile.text)
            def semverCore = (pkgJson.version ?: '0.0.0').toString().tokenize('-')[0]
            def parts = semverCore.tokenize('.').collect { part -> part.isInteger() ? part.toInteger() : 0 }
            while (parts.size() < 3) { parts << 0 }
            if (parts[0] > 0 || parts[1] > 0 || parts[2] > 0) {
                versionName = "${parts[0]}.${parts[1]}.${parts[2]}"
                // 保证 versionCode 随 semver 单调递增（上架/覆盖安装要求）
                versionCode = parts[0] * 10000 + parts[1] * 100 + parts[2]
            } else {
                logger.lifecycle("WARN: package.json version is empty/zero, fallback to "
                        + "${FALLBACK_VERSION_NAME} (${FALLBACK_VERSION_CODE})")
            }
        } else {
            logger.lifecycle("WARN: package.json not found, fallback to "
                    + "${FALLBACK_VERSION_NAME} (${FALLBACK_VERSION_CODE})")
        }
    } catch (Throwable ignored) {
        logger.lifecycle("WARN: package.json unreadable (" + ignored.getClass().getSimpleName()
                + "), fallback to ${FALLBACK_VERSION_NAME} (${FALLBACK_VERSION_CODE})")
    }
    return [versionName, versionCode]
}

def resolvedVersion = resolveVersion()
def appVersionName = resolvedVersion[0]
def appVersionCode = resolvedVersion[1]

android {
    namespace "com.qoder.cinema"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.qoder.cinema"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // TVBox jar 爬虫运行时依赖：第三方 jar 内部直接用 okhttp/gson/slf4j
    implementation "com.squareup.okhttp3:okhttp:4.9.3"
    implementation "com.google.code.gson:gson:2.8.6"
    implementation "org.slf4j:slf4j-android:1.7.36"
    // CHG-16 drpy 运行时：QuickJS 引擎（纯 Java 绑定，同步 API，支持 ES2020/async）+ jsoup（pdfh/pdfa 选择器）
    implementation "wang.harlon.quickjs:wrapper-android:3.2.3"
    implementation "org.jsoup:jsoup:1.18.3"
    // v1.7/CHG-21 ExoPlayer PoC（Spike）：Media3 原生引擎，默认不启用（experimentalNativePlayer）
    // 退出标准见 docs/02-方案/契约变更-v1.7.md §2.4；不达标可整段移除回退 WebView
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.3.1"
    implementation "androidx.media3:media3-ui:1.3.1"
    // P0-4: OkHttp 数据源（连接池、HTTP/2、gzip）
    implementation "androidx.media3:media3-datasource-okhttp:1.3.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
