<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="PeanutMov —— 自用观影 App，数据仅存本机" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PeanutMov</title>
    <style>
      /* 启动骨架：内联以避免首屏样式阻塞；底色与 tokens.css 双主题基线一致 */
      html,
      body {
        margin: 0;
        height: 100%;
        background-color: #0b0b0f;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC',
          'Microsoft YaHei', Arial, sans-serif;
      }
      html[data-theme='light'] body {
        background-color: #edeff3;
        color: #1d2128;
      }
      #app {
        min-height: 100%;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 90% at 50% 42%, #241703 0%, #120e08 45%, #0b0b0f 100%);
      }
      html[data-theme='light'] .boot-splash {
        background: radial-gradient(120% 90% at 50% 42%, #fff7e8 0%, #f4f2ec 45%, #edeff3 100%);
      }
      .boot-splash__mark {
        width: 88px;
        height: 88px;
        animation: boot-float 2400ms cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .boot-splash__word {
        font-size: 24px;
        line-height: 32px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #f2ecdf;
      }
      html[data-theme='light'] .boot-splash__word {
        color: #1d2128;
      }
      .boot-splash__dots {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      .boot-splash__dots i {
        width: 5px;
        height: 8px;
        border-radius: 2px;
        background: #f0a82e;
        opacity: 0.25;
        animation: boot-dot 1200ms cubic-bezier(0.2, 0, 0, 1) infinite;
      }
      .boot-splash__dots i:nth-child(2) {
        animation-delay: 120ms;
      }
      .boot-splash__dots i:nth-child(3) {
        animation-delay: 240ms;
      }
      .boot-splash__dots i:nth-child(4) {
        animation-delay: 360ms;
      }
      .boot-splash__dots i:nth-child(5) {
        animation-delay: 480ms;
      }
      @keyframes boot-float {
        0%,
        100% {
          transform: translateY(3px);
        }
        50% {
          transform: translateY(-3px);
        }
      }
      @keyframes boot-dot {
        0%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 0.9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__mark,
        .boot-splash__dots i {
          animation: none;
        }
      }
    </style>
    <script>
      // 首帧前同步主题，避免启动遮罩与落地主题异色闪白（键与 useTheme 一致）
      (function () {
        try {
          var m = localStorage.getItem('peanutmov:theme');
          var dark =
            m === 'dark' ||
            (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* 隐私模式等 localStorage 不可用时保留默认 dark */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" role="status" aria-label="正在启动 PeanutMov">
        <svg class="boot-splash__mark" viewBox="-360 -360 720 720" aria-hidden="true">
          <defs>
            <linearGradient id="boot-g" gradientUnits="userSpaceOnUse" x1="-303" y1="-350" x2="303" y2="350">
              <stop offset="0" stop-color="#FFD873" />
              <stop offset="0.45" stop-color="#FF9E2C" />
              <stop offset="1" stop-color="#F4511E" />
            </linearGradient>
            <mask id="boot-h">
              <rect x="-600" y="-600" width="1200" height="1200" fill="#fff" />
              <g stroke="#000" stroke-width="16" stroke-linecap="round">
                <line x1="0" y1="-357" x2="110.4" y2="-122.7" />
                <line x1="309.2" y1="-178.5" x2="161.4" y2="34.4" />
                <line x1="309.2" y1="178.5" x2="51" y2="156.9" />
                <line x1="0" y1="357" x2="-110.4" y2="122.7" />
                <line x1="-309.2" y1="178.5" x2="-161.4" y2="-34.4" />
                <line x1="-309.2" y1="-178.5" x2="-51" y2="-156.9" />
              </g>
              <polygon points="-78,-92 -78,92 82,0" fill="#000" stroke="#000" stroke-width="40" stroke-linejoin="round" />
            </mask>
          </defs>
          <g mask="url(#boot-h)">
            <path
              d="M -45,-324 Q 0,-350 45,-324 L 258.1,-201 Q 303.1,-175 303.1,-123 L 303.1,123 Q 303.1,175 258.1,201 L 45,324 Q 0,350 -45,324 L -258.1,201 Q -303.1,175 -303.1,123 L -303.1,-123 Q -303.1,-175 -258.1,-201 L -45,-324 Z"
              fill="url(#boot-g)"
            />
            <g fill="#ffffff" opacity="0.06">
              <polygon points="0,0 0,-350 303.1,-175" />
              <polygon points="0,0 303.1,175 0,350" />
              <polygon points="0,0 -303.1,175 -303.1,-175" />
            </g>
            <g fill="#000000" opacity="0.05">
              <polygon points="0,0 303.1,-175 303.1,175" />
              <polygon points="0,0 0,350 -303.1,175" />
              <polygon points="0,0 -303.1,-175 0,-350" />
            </g>
          </g>
        </svg>
        <div class="boot-splash__word">PeanutMov</div>
        <div class="boot-splash__dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
