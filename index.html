<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="PeanutMov —— 自用观影 App，数据仅存本机" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PeanutMov</title>
    <style>
      /* 启动骨架：内联以避免首屏样式阻塞（颜色与 tokens.css 的 dark 基线一致） */
      html,
      body {
        margin: 0;
        height: 100%;
        background-color: #0b0b0f;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC',
          'Microsoft YaHei', Arial, sans-serif;
      }
      #app {
        min-height: 100%;
      }
      .boot-splash {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      .boot-splash__mark {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: linear-gradient(135deg, #ffc65c 0%, #f0a82e 48%, #d8901d 100%);
        animation: boot-pulse 1200ms cubic-bezier(0.2, 0, 0, 1) infinite;
      }
      .boot-splash__text {
        font-size: 14px;
        line-height: 20px;
        color: #8a8a94;
        letter-spacing: 0.04em;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash">
        <div class="boot-splash__mark" aria-hidden="true"></div>
        <p class="boot-splash__text">正在启动 PeanutMov…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
