name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_CERT_SHA256: ${{ secrets.ANDROID_KEY_CERT_SHA256 }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          : "${ANDROID_KEY_CERT_SHA256:?Missing ANDROID_KEY_CERT_SHA256}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:run

      - name: Build web assets
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Verify tag version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vX.Y.Z" >&2
            exit 1
          fi
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag v$VERSION does not match package.json $PACKAGE_VERSION" >&2
            exit 1
          fi
          if ! node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); process.exit(major <= 199 && minor <= 99 && patch <= 99 ? 0 : 1)' "$VERSION"; then
            echo "versionCode bounds require major <= 199 and minor/patch <= 99" >&2
            exit 1
          fi

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon :app:assembleRelease

      - name: Verify and package APK
        env:
          ANDROID_KEY_CERT_SHA256: ${{ secrets.ANDROID_KEY_CERT_SHA256 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          APK_NAME="PeanutMov-${VERSION}-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "apksigner or aapt not found" >&2
            exit 1
          fi
          CERT_REPORT="$("$APKSIGNER" verify --verbose --print-certs "$SOURCE_APK")"
          printf '%s\n' "$CERT_REPORT"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_REPORT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ' ' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$ANDROID_KEY_CERT_SHA256" | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$EXPECTED_CERT_SHA256" =~ ^[0-9A-F]{64}$ ]] || [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "APK signing certificate does not match ANDROID_KEY_CERT_SHA256" >&2
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$SOURCE_APK")"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          EXPECTED_VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [ "$ACTUAL_VERSION_NAME" != "$VERSION" ] || [ "$ACTUAL_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "APK version does not match tag $VERSION" >&2
            exit 1
          fi
          cp "$SOURCE_APK" "$APK_NAME"
          sha256sum "$APK_NAME" > SHA256SUMS
          APK_SHA256="$(cut -d ' ' -f 1 SHA256SUMS)"
          APK_SIZE="$(stat -c '%s' "$APK_NAME")"
          RELEASE_NOTES="$(git show -s --format=%B "$GITHUB_REF_NAME")" \
          VERSION="$VERSION" APK_NAME="$APK_NAME" APK_SHA256="$APK_SHA256" APK_SIZE="$APK_SIZE" \
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const version = process.env.VERSION;
          const [major, minor, patch] = version.split('.').map(Number);
          const manifest = {
            versionName: version,
            versionCode: major * 10000 + minor * 100 + patch,
            notes: process.env.RELEASE_NOTES.trim() || `PeanutMov ${version}`,
            apk: {
              name: process.env.APK_NAME,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}/${process.env.APK_NAME}`,
              sha256: process.env.APK_SHA256,
              sizeBytes: Number(process.env.APK_SIZE),
            },
          };
          writeFileSync('update.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PeanutMov-${{ github.ref_name }}
          path: |
            PeanutMov-*-release.apk
            update.json
            SHA256SUMS
          if-no-files-found: error

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            PeanutMov-*-release.apk
            update.json
            SHA256SUMS
